name: Сборка Гермес PRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Загрузка библиотек
        run: flutter pub get

      - name: Компиляция APK файла
        run: flutter build apk --release

      - name: Выгрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: hermes-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
